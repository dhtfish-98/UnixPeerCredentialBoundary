name: Linux peer credential boundary

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  real-kernel-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run real UID and AF_UNIX boundary
        run: python3 scripts/run_linux.py --out "$RUNNER_TEMP/unix-peer-credential-boundary"
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-peer-credential-probe
          path: ${{ runner.temp }}/unix-peer-credential-boundary/
          if-no-files-found: warn
          retention-days: 14
